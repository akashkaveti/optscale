# Values file for deploying OptScale using official Hystax images
# This is the quickest way to get started - no image building required!
#
# Usage: helm install optscale ./optscale -f values-hystax.yaml

# =============================================================================
# REQUIRED: Update these values before deployment
# =============================================================================

global:
  imageRegistry: "hystax"
  imageTag: "latest"
  imagePullPolicy: IfNotPresent

cluster:
  # Your OptScale public IP or domain name
  publicIp: ""  # e.g., "optscale.example.com" or "192.168.1.100"
  companyName: "TII"
  productName: "OptScale"

# IMPORTANT: Generate unique secrets before deployment!
secrets:
  clusterSecret: "oodoFei9thooQuaigohngieZ"
  encryptionSalt: "yeexietaila8eezae0hua8Wu"
  encryptionKey: "Ahbe3gaes0ohghi6Diepooju"

# =============================================================================
# AWS Credentials (Required for AWS cost monitoring)
# =============================================================================
serviceCredentials:
  aws:
    enabled: true
    accessKeyId: ""
    secretAccessKey: ""

# =============================================================================
# Database Passwords (CHANGE ALL OF THESE!)
# =============================================================================
mariadb:
  credentials:
    rootPassword: "CHANGE-ME-MARIADB"

mongodb:
  credentials:
    username: "root"
    password: "CHANGE-ME-MONGODB"
    key: "CHANGE-ME-MONGODB-KEY"

rabbitmq:
  credentials:
    username: "optscale"
    password: "CHANGE-ME-RABBITMQ"
    cookie: "CHANGE-ME-ERLANG-COOKIE"

clickhouse:
  db:
    password: "CHANGE-ME-CLICKHOUSE"

minio:
  credentials:
    accessKey: "optscale-minio"
    secretKey: "CHANGE-ME-MINIO"

# =============================================================================
# Optional: SMTP for email notifications
# =============================================================================
smtp:
  enabled: false
  # server: "smtp.gmail.com"
  # port: 587
  # email: "optscale@yourcompany.com"
  # login: ""
  # password: ""
  # protocol: "TLS"

# =============================================================================
# SSL Configuration
# =============================================================================
ssl:
  enabled: true
  forceRedirect: true
  certificateSecretName: "optscale-tls"

# Disable email verification for easier initial setup
disableEmailVerification: true

# =============================================================================
# Disable optional features to reduce resource usage
# =============================================================================
slacker:
  enabled: false

jiraBus:
  enabled: false

jiraUi:
  enabled: false

elk:
  enabled: false

liveDemoGenerator:
  enabled: false

demoOrgCleanup:
  enabled: false

calendarObserver:
  enabled: false
