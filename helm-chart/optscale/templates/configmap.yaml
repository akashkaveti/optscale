apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "optscale.fullname" . }}-config
  labels:
    {{- include "optscale.labels" . | nindent 4 }}
data:
  PUBLIC_IP: {{ .Values.cluster.publicIp | quote }}
  COMPANY_NAME: {{ .Values.cluster.companyName | quote }}
  PRODUCT_NAME: {{ .Values.cluster.productName | quote }}
  CLUSTER_DOMAIN: {{ .Values.cluster.clusterDomain | quote }}
  
  # Service endpoints
  ETCD_HOST: "etcd"
  ETCD_PORT: "2379"
  MARIADB_HOST: "mariadb"
  MARIADB_PORT: "3306"
  MONGODB_HOST: "mongodb"
  MONGODB_PORT: "27017"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  INFLUXDB_HOST: "influxdb"
  INFLUXDB_PORT: "8086"
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "8123"
  MINIO_HOST: "minio"
  MINIO_PORT: "9000"
  
  # API endpoints
  RESTAPI_HOST: "restapi"
  RESTAPI_PORT: "80"
  AUTH_HOST: "auth"
  AUTH_PORT: "80"
  KEEPER_HOST: "keeper"
  KEEPER_PORT: "80"
  HERALD_HOST: "herald"
  HERALD_PORT: "80"
  KATARA_HOST: "katara"
  KATARA_PORT: "80"
  INSIDER_HOST: "insider-api"
  INSIDER_PORT: "80"
  SLACKER_HOST: "slacker"
  SLACKER_PORT: "80"
  METROCULUS_HOST: "metroculus-api"
  METROCULUS_PORT: "80"
  JIRABUS_HOST: "jira-bus"
  JIRABUS_PORT: "80"
  DIPROXY_HOST: "diproxy"
  DIPROXY_PORT: "80"
  
  # Settings
  TOKEN_EXPIRATION: {{ .Values.tokenExpiration | quote }}
  INVITE_EXPIRATION_DAYS: {{ .Values.inviteExpirationDays | quote }}
  DISABLE_EMAIL_VERIFICATION: {{ .Values.disableEmailVerification | quote }}
  EVENTS_QUEUE: {{ .Values.eventsQueue | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "optscale.fullname" . }}-databases
  labels:
    {{- include "optscale.labels" . | nindent 4 }}
data:
  databases.txt: |
    {{- range .Values.databases }}
    {{ . }}
    {{- end }}
