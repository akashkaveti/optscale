{{- if .Values.etcd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: etcd
  labels:
    app: etcd
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  type: {{ .Values.etcd.service.type }}
  ports:
    - port: {{ .Values.etcd.service.port }}
      targetPort: 2379
      protocol: TCP
      name: client
    - port: {{ .Values.etcd.service.peerPort }}
      targetPort: 2380
      protocol: TCP
      name: peer
  selector:
    app: etcd
    {{- include "optscale.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-headless
  labels:
    app: etcd
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.etcd.service.port }}
      targetPort: 2379
      name: client
    - port: {{ .Values.etcd.service.peerPort }}
      targetPort: 2380
      name: peer
  selector:
    app: etcd
    {{- include "optscale.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  labels:
    app: etcd
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  serviceName: etcd-headless
  replicas: 1
  selector:
    matchLabels:
      app: etcd
      {{- include "optscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: etcd
        {{- include "optscale.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: etcd
          image: {{ include "optscale.image" (dict "global" .Values.global "image" .Values.etcd.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          env:
            - name: ETCD_NAME
              value: "etcd-0"
            - name: ETCD_DATA_DIR
              value: "/etcd-data"
            - name: ETCD_LISTEN_CLIENT_URLS
              value: "http://0.0.0.0:2379"
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "http://etcd:2379"
            - name: ETCD_LISTEN_PEER_URLS
              value: "http://0.0.0.0:2380"
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: "http://etcd-0.etcd-headless:2380"
            - name: ETCD_INITIAL_CLUSTER
              value: "etcd-0=http://etcd-0.etcd-headless:2380"
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: "new"
            - name: ETCD_HEARTBEAT_INTERVAL
              value: {{ .Values.etcd.hbInterval | quote }}
            - name: ETCD_ELECTION_TIMEOUT
              value: {{ .Values.etcd.electionTimeout | quote }}
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
          {{- with .Values.etcd.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: etcd-data
          emptyDir: {}
{{- end }}
