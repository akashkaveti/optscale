# =============================================================================
# INSIDER API
# =============================================================================
{{- if .Values.insiderApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: insider-api
  labels:
    app: insider-api
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  type: {{ .Values.insiderApi.service.type }}
  ports:
    - port: {{ .Values.insiderApi.service.port }}
      targetPort: {{ .Values.insiderApi.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: insider-api
    {{- include "optscale.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insider-api
  labels:
    app: insider-api
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.insiderApi.replicaCount }}
  selector:
    matchLabels:
      app: insider-api
      {{- include "optscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: insider-api
        {{- include "optscale.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "optscale.waitForService" (dict "name" "etcd" "service" "etcd" "namespace" .Release.Namespace "port" "2379") | nindent 8 }}
      containers:
        - name: insider-api
          image: {{ include "optscale.image" (dict "global" .Values.global "image" .Values.insiderApi.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.insiderApi.service.targetPort }}
              name: http
          env:
            {{- include "optscale.commonEnv" . | nindent 12 }}
          {{- include "optscale.readinessProbe" (dict "port" .Values.insiderApi.service.targetPort) | nindent 10 }}
          {{- with .Values.insiderApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
