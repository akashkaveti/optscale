# =============================================================================
# BUMI SCHEDULER
# =============================================================================
{{- if .Values.bumiScheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bumi-scheduler
  labels:
    app: bumi-scheduler
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bumiScheduler.replicaCount }}
  selector:
    matchLabels:
      app: bumi-scheduler
      {{- include "optscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: bumi-scheduler
        {{- include "optscale.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "optscale.waitForService" (dict "name" "etcd" "service" "etcd" "namespace" .Release.Namespace "port" "2379") | nindent 8 }}
        {{- include "optscale.waitForService" (dict "name" "rabbitmq" "service" "rabbitmq" "namespace" .Release.Namespace "port" "5672") | nindent 8 }}
      containers:
        - name: bumi-scheduler
          image: {{ include "optscale.image" (dict "global" .Values.global "image" .Values.bumiScheduler.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            {{- include "optscale.commonEnv" . | nindent 12 }}
          {{- with .Values.bumiScheduler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
---
