{{- /*
Thanos - Metrics storage for Kubernetes cost monitoring
Components: receive, storegateway, query, compactor
*/ -}}
{{- if .Values.thanos.enabled }}
# =============================================================================
# THANOS SECRET - S3 configuration for MinIO backend
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: thanos-secret
  labels:
    app: thanos
    {{- include "optscale.labels" . | nindent 4 }}
type: Opaque
stringData:
  thanos_conf.yaml: |
    type: S3
    config:
      bucket: thanos
      endpoint: "minio:80"
      access_key: {{ .Values.minio.credentials.accessKey | quote }}
      secret_key: {{ .Values.minio.credentials.secretKey | quote }}
      insecure: true
    prefix: "data"
---
# =============================================================================
# THANOS RECEIVE - Accepts remote write from Prometheus/collectors
# =============================================================================
{{- if .Values.thanos.receive.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-receive-limits-config
  labels:
    app: thanos-receive
    {{- include "optscale.labels" . | nindent 4 }}
data:
  thanos_limits.yaml: |
    write:
      global:
        max_concurrency: {{ .Values.thanos.receive.maxConcurrency | default 100 }}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive
  labels:
    app: thanos-receive
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 10902
      targetPort: http
      protocol: TCP
      name: http
    - port: 10901
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 19291
      targetPort: remote
      protocol: TCP
      name: remote
  selector:
    app: thanos-receive
    {{- include "optscale.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-receive
  labels:
    app: thanos-receive
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.thanos.receive.replicaCount | default 1 }}
  podManagementPolicy: OrderedReady
  serviceName: thanos-receive
  selector:
    matchLabels:
      app: thanos-receive
      {{- include "optscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: thanos-receive
        {{- include "optscale.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "optscale.waitForService" (dict "name" "minio" "service" "minio" "namespace" .Release.Namespace "port" "80") | nindent 8 }}
      containers:
        - name: receive
          image: "thanosio/thanos:v0.39.1"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 10901
              name: grpc
              protocol: TCP
            - containerPort: 10902
              name: http
              protocol: TCP
            - containerPort: 19291
              name: remote
              protocol: TCP
          command:
            - thanos
          args:
            - receive
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --remote-write.address=0.0.0.0:19291
            - --objstore.config-file=/var/thanos/config/thanos_conf.yaml
            - --tsdb.path=/var/thanos/receive
            - --tsdb.retention={{ .Values.thanos.receive.retention | default "15d" }}
            - --tsdb.wal-compression
            - --tsdb.no-lockfile
            - --tsdb.out-of-order.time-window=1h
            - --label=receive="$(NAME)"
            - --receive.tenant-header=Cloud-Account-Id
            - --receive-forward-timeout=2m
            - --log.level=info
            - --receive.limits-config-file=/var/thanos/limits_config/thanos_limits.yaml
            - --tsdb.memory-snapshot-on-shutdown
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/thanos/receive
            - name: config
              mountPath: /var/thanos/config
              readOnly: true
            - name: limits-config
              mountPath: /var/thanos/limits_config
          {{- with .Values.thanos.receive.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsUser: 0
      volumes:
        - name: config
          secret:
            secretName: thanos-secret
            items:
              - key: thanos_conf.yaml
                path: thanos_conf.yaml
        - name: limits-config
          configMap:
            name: thanos-receive-limits-config
        - name: data
          emptyDir: {}
{{- end }}
---
# =============================================================================
# THANOS STOREGATEWAY - Reads historical data from object storage
# =============================================================================
{{- if .Values.thanos.storegateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: thanos-storegateway
  labels:
    app: thanos-storegateway
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 10902
      targetPort: http
      protocol: TCP
      name: http
    - port: 10901
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    app: thanos-storegateway
    {{- include "optscale.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-storegateway
  labels:
    app: thanos-storegateway
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.thanos.storegateway.replicaCount | default 1 }}
  podManagementPolicy: OrderedReady
  serviceName: thanos-storegateway
  selector:
    matchLabels:
      app: thanos-storegateway
      {{- include "optscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: thanos-storegateway
        {{- include "optscale.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "optscale.waitForService" (dict "name" "minio" "service" "minio" "namespace" .Release.Namespace "port" "80") | nindent 8 }}
      containers:
        - name: storegateway
          image: "thanosio/thanos:v0.39.1"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - thanos
          args:
            - store
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --ignore-deletion-marks-delay={{ .Values.thanos.storegateway.ignoreDeletionMarksDelay | default "24h" }}
            - --objstore.config-file=/var/thanos/config/thanos_conf.yaml
            - --data-dir=/var/thanos/data
          ports:
            - containerPort: 10901
              name: grpc
              protocol: TCP
            - containerPort: 10902
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/thanos/data
            - name: config
              mountPath: /var/thanos/config
              readOnly: true
          {{- with .Values.thanos.storegateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsUser: 0
      volumes:
        - name: config
          secret:
            secretName: thanos-secret
            items:
              - key: thanos_conf.yaml
                path: thanos_conf.yaml
        - name: data
          emptyDir: {}
{{- end }}
---
# =============================================================================
# THANOS QUERY - Query interface for metrics
# =============================================================================
{{- if .Values.thanos.query.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  labels:
    app: thanos-query
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 10902
      targetPort: http
      protocol: TCP
      name: http
    - port: 10901
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    app: thanos-query
    {{- include "optscale.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  labels:
    app: thanos-query
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.thanos.query.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: thanos-query
      {{- include "optscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: thanos-query
        {{- include "optscale.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "optscale.waitForService" (dict "name" "thanos-receive" "service" "thanos-receive" "namespace" .Release.Namespace "port" "10902") | nindent 8 }}
        {{- include "optscale.waitForService" (dict "name" "thanos-storegateway" "service" "thanos-storegateway" "namespace" .Release.Namespace "port" "10902") | nindent 8 }}
      containers:
        - name: query
          image: "thanosio/thanos:v0.39.1"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - thanos
          args:
            - query
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --endpoint=dnssrv+_grpc._tcp.thanos-storegateway.{{ .Release.Namespace }}.svc.cluster.local
            - --endpoint=dnssrv+_grpc._tcp.thanos-receive.{{ .Release.Namespace }}.svc.cluster.local
          ports:
            - name: http
              containerPort: 10902
              protocol: TCP
            - name: grpc
              containerPort: 10901
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          {{- with .Values.thanos.query.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
---
# =============================================================================
# THANOS COMPACTOR - Compacts and downsamples data in object storage
# =============================================================================
{{- if .Values.thanos.compactor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-compactor
  labels:
    app: thanos-compactor
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thanos-compactor
      {{- include "optscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: thanos-compactor
        {{- include "optscale.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        {{- include "optscale.waitForService" (dict "name" "minio" "service" "minio" "namespace" .Release.Namespace "port" "80") | nindent 8 }}
      containers:
        - name: compactor
          image: "thanosio/thanos:v0.39.1"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - thanos
          args:
            - compact
            - --http-address=0.0.0.0:10902
            - --objstore.config-file=/var/thanos/config/thanos_conf.yaml
            - --data-dir=/var/thanos/compact
            - --retention.resolution-raw={{ .Values.thanos.compactor.retentionRaw | default "30d" }}
            - --retention.resolution-5m={{ .Values.thanos.compactor.retention5m | default "60d" }}
            - --retention.resolution-1h={{ .Values.thanos.compactor.retention1h | default "180d" }}
            - --wait
          ports:
            - name: http
              containerPort: 10902
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/thanos/compact
            - name: config
              mountPath: /var/thanos/config
              readOnly: true
          {{- with .Values.thanos.compactor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          secret:
            secretName: thanos-secret
            items:
              - key: thanos_conf.yaml
                path: thanos_conf.yaml
        - name: data
          emptyDir: {}
{{- end }}
{{- end }}
