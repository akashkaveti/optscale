# =============================================================================
# INSIDER SCHEDULER
# =============================================================================
{{- if .Values.insiderScheduler.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: insider-scheduler
  labels:
    app: insider-scheduler
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  schedule: {{ .Values.insiderScheduler.schedule | quote }}
  startingDeadlineSeconds: 300
  jobTemplate:
    metadata:
      labels:
        app: insider-scheduler
        {{- include "optscale.selectorLabels" . | nindent 8 }}
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: insider-scheduler
            {{- include "optscale.selectorLabels" . | nindent 12 }}
        spec:
          initContainers:
            {{- include "optscale.waitForService" (dict "name" "etcd" "service" "etcd" "namespace" .Release.Namespace "port" "2379") | nindent 12 }}
            {{- include "optscale.waitForService" (dict "name" "rabbitmq" "service" "rabbitmq" "namespace" .Release.Namespace "port" "5672") | nindent 12 }}
          containers:
            - name: insider-scheduler
              image: {{ include "optscale.image" (dict "global" .Values.global "image" .Values.insiderScheduler.image) }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              env:
                {{- include "optscale.commonEnv" . | nindent 16 }}
          restartPolicy: OnFailure
{{- end }}
