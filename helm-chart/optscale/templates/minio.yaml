{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  type: {{ .Values.minio.service.type }}
  ports:
    - port: {{ .Values.minio.service.port }}
      targetPort: {{ .Values.minio.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: minio
    {{- include "optscale.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: minio
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
      {{- include "optscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: minio
        {{- include "optscale.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          args:
            - server
            - /data
          ports:
            - containerPort: {{ .Values.minio.service.targetPort }}
              name: http
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "optscale.fullname" . }}-minio
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "optscale.fullname" . }}-minio
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: {{ .Values.minio.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.minio.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.minio.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.minio.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
{{- if .Values.minio.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    app: minio
    {{- include "optscale.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size }}
{{- end }}
---
# MinIO Init Job - Creates required buckets (thanos for metrics storage)
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-{{ .Release.Revision }}
  labels:
    app: minio-init
    {{- include "optscale.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: minio-init
        {{- include "optscale.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        {{- include "optscale.waitForService" (dict "name" "minio" "service" "minio" "namespace" .Release.Namespace "port" "80") | nindent 8 }}
      containers:
        - name: minio-init
          image: "minio/mc:latest"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "optscale.fullname" . }}-minio
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "optscale.fullname" . }}-minio
                  key: secret-key
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Configuring MinIO client..."
              mc alias set myminio http://minio:80 $MINIO_ACCESS_KEY $MINIO_SECRET_KEY
              
              echo "Creating thanos bucket for metrics storage..."
              mc mb --ignore-existing myminio/thanos
              
              echo "MinIO initialization complete!"
{{- end }}
