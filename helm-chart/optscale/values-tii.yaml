# =============================================================================
# THANOS (Metrics storage)
# =============================================================================
thanos:
  enabled: true
  receive:
    enabled: true
    replicaCount: 1
    retention: "15d"
    maxConcurrency: 100
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
  storegateway:
    enabled: true
    replicaCount: 1
    ignoreDeletionMarksDelay: "24h"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  query:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  compactor:
    enabled: true
    retentionRaw: "30d"
    retention5m: "60d"
    retention1h: "180d"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  web:
    enabled: true

errorPages:
  enabled: true

# =============================================================================
# SETTINGS
# =============================================================================
tokenExpiration: 168
inviteExpirationDays: 30
disableEmailVerification: true
eventsQueue: "events_queue"

databases:
  - auth-db
  - my-db
