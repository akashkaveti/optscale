# OptScale Values for tii-test.com
# Generated with secure random passwords

global:
  imageRegistry: "hystax"
  imageTag: "2025112701-public"
  imagePullPolicy: IfNotPresent

# =============================================================================
# CLUSTER CONFIGURATION
# =============================================================================
cluster:
  publicIp: "optscale.tii-test.com"
  companyName: "TII"
  productName: "OptScale"
  clusterDomain: "cluster.local"

# =============================================================================
# SECRETS (Pre-generated secure values)
# =============================================================================
secrets:
  clusterSecret: "a8f3d2e1-7b4c-49a6-8e5f-1c2d3e4f5a6b"
  encryptionSalt: "Kx9mPqR3vT7wYz2B5nHjLcFgDsAe"
  encryptionKey: "8f4a2c6e9b1d3f5a7c9e2b4d6f8a1c3e"

# =============================================================================
# SSL/TLS with Cert-Manager
# =============================================================================
ssl:
  enabled: true
  forceRedirect: true
  certificateSecretName: "optscale-tls"
  certManager:
    enabled: true
    issuer: "lets-encrypt-tii-test-com"
    issuerType: "cluster-issuer"

# =============================================================================
# INGRESS
# =============================================================================
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

# =============================================================================
# AWS Credentials (Add your credentials here)
# =============================================================================
serviceCredentials:
  aws:
    enabled: true
    # TODO: Add your AWS credentials
    accessKeyId: ""
    secretAccessKey: ""
  azure:
    enabled: false
  gcp:
    enabled: false
  alibaba:
    enabled: false

# =============================================================================
# DATABASE PASSWORDS (Secure random values)
# =============================================================================
mariadb:
  enabled: true
  credentials:
    rootPassword: "Mdb7Kx9PqR3vT2wY"
  persistence:
    enabled: true
    hostPath: /optscale/db

mongodb:
  enabled: true
  external: false
  credentials:
    username: "root"
    password: "Mng8Lz4NpS6uX1yB"
    key: "MngKey5Hj7Km9Np2Qr4St6Uv8Wx0Yz1Ab3Cd"
  cacheSize: 1.0
  persistence:
    enabled: true
    hostPath: /optscale/mongo

rabbitmq:
  enabled: true
  credentials:
    username: "optscale"
    password: "Rmq6Jh8Kl0Mn2Op4"
    cookie: "RmqCookie3Ef5Gh7Ij9Kl1Mn3Op5Qr7St9Uv"
